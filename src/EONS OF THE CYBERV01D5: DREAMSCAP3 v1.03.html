function srng(s){let v=s|0;return()=>{v=Math.imul(v,1664525)+1013904223|0;return(v>>>0)/4294967296;};}
function hi(...a){let h=0;for(const x of a)h=Math.imul(h^(x|0),0x9e3779b9)>>>0;return h;}
function hf(...a){return hi(...a)/4294967296;}
function vdot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function vsub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function vadd(a,b){return[a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function vmul(v,s){return[v[0]*s,v[1]*s,v[2]*s];}
function vnorm(v){const m=Math.hypot(...v);return m>1e-9?[v[0]/m,v[1]/m,v[2]/m]:[0,0,1];}
function rod(v,ax,a){const c=Math.cos(a),s=Math.sin(a),cr=[ax[1]*v[2]-ax[2]*v[1],ax[2]*v[0]-ax[0]*v[2],ax[0]*v[1]-ax[1]*v[0]],d=vdot(ax,v);return[v[0]*c+cr[0]*s+ax[0]*d*(1-c),v[1]*c+cr[1]*s+ax[1]*d*(1-c),v[2]*c+cr[2]*s+ax[2]*d*(1-c)];}

// ================================================================ NARRATOR
class Narrator{
  constructor(){this._q=[];this._busy=false;this._ok='speechSynthesis'in window;}
  say(text,priority=false){
    if(!this._ok)return;
    const t=text.replace(/[^\x00-\x7F]/g,' ').replace(/\s+/g,' ').trim();
    if(!t)return;
    if(priority)this._q.unshift(t);else if(this._q.length<3)this._q.push(t);
    this._next();
  }
  _next(){
    if(this._busy||!this._q.length)return;
    this._busy=true;
    const u=new SpeechSynthesisUtterance(this._q.shift());
    u.rate=1.15;u.pitch=0.9;u.volume=0.65;
    u.onend=()=>{this._busy=false;this._next();};
    u.onerror=()=>{this._busy=false;this._next();};
    speechSynthesis.speak(u);
  }
  stop(){if(this._ok)speechSynthesis.cancel();this._q=[];this._busy=false;}
}

// ================================================================ FULL-SCREEN LOG RENDERER
function renderFullLog(P,W,H){
  const entries=P.logEntries,scroll=P.logScroll||0;
  const lines=['','  '+'═'.repeat(Math.floor(W/2)-2)+'  ',
    `   A R T I F A C T   L O G   (${entries.length} entries)  [L] close  PgUp/PgDn scroll`,
    '  '+'═'.repeat(Math.floor(W/2)-2)+'  ',''];
  let row=5;
  for(let i=Math.max(0,scroll);i<entries.length&&row<H-3;i++){
    for(const sub of entries[i].split('\n')){if(row>=H-3)break;lines.push('    '+sub);row++;}
    lines.push('');row++;
  }
  while(lines.length<H)lines.push('');
  lines.push('  '+'═'.repeat(Math.floor(W/2)-2)+'  ');
  return lines.slice(0,H).join('\n');
}

    if(P.vehicles.length<60){const n=[0,1,1,2,2,3,4,5,6,8][Math.floor(rng()*10)],nid=Math.max(0,...P.vehicles.map(v=>v.id),0)+1;for(let i=0;i<n;i++){for(let a=0;a<20;a++){const vx=wx+(rng()*14.4-7.2),vy=wy+(rng()*14.4-7.2);if(r.isOpen(vx,vy)){P.vehicles.push({id:nid+i,x:vx,y:vy,angle:rng()*TAU,kind:'vehicle'});break;}}}}
    if(rng()<.45){for(let a=0;a<20;a++){const lx=wx+(rng()*12.8-6.4),ly=wy+(rng()*12.8-6.4);if(r.isOpen(lx,ly)){const seed=(hi(cx,cy,this._ls))&0x7FFFFFFF;const entry=rng()<.5&&LPOOL.length?LPOOL[Math.floor(rng()*LPOOL.length)]:glg(seed);this._sh.push([lx,ly,entry,false]);break;}}}}

// ================================================================ PLAYER
class Player{

    this.boardRouter=null;this.boarded=null;
    this._stE=[];this._stR=null;
    this._ckX=50;this._ckY=50;this._stepCd=0;
    this.worldBubble=new WorldBub();
    this._planetCache={}; // keyed by planet.id — preserves terrain/entities between visits
  }

  _safePos(router,rng,lo=4,hi2=96){for(let i=0;i<120;i++){const x=lo+rng()*(hi2-lo),y=lo+rng()*(hi2-lo);if(router.isOpen(x,y))return[x,y];}return[50,50];}

      // Restore exact world state — terrain, entities, vehicles, terminals all unchanged
      this.entities=cached.entities;this.vehicles=cached.vehicles;this.terminals=cached.terminals;
      this.puItems=cached.puItems;this.artifactItems=cached.artifactItems;
      this.worldBubble=cached.worldBubble;
      this.cv.pos=[cached.spawnX,cached.spawnY];
      this._ckX=cached.ckX;this._ckY=cached.ckY;
    }else{
      // First visit — find open spawn across multiple candidates
      const candidates=[[50,50],[20,20],[80,20],[20,80],[80,80],[35,50],[65,50],[50,35],[50,65]];
      let ox=50,oy=50;
      for(const[cx,cy]of candidates){const[tx,ty]=this._openSpawn(this.router,cx,cy);if(this.router.isOpen(tx,ty)){ox=tx;oy=ty;break;}}

}

// ================================================================ PHOS CITY WALL TEXTURE
function _pch(...a){let h=0;for(const x of a)h=((h^(typeof x==='string'?x.charCodeAt(0):x|0))*2654435761)>>>0;return h/4294967296;}
function _pcGlyph(bv,u,v,wx,wy,fog){
  const[cols,rows,lit]=[bv===1?[5,9,.30]:bv===2?[4,16,.42]:bv===3?[7,18,.55]:[6,12,.35]][0];
  const ci=Math.floor(u*cols),ri=Math.floor(v*rows),fu=u*cols-ci,fv=v*rows-ri;
  const inW=fu>.12&&fu<.88&&fv>.18&&fv<.82;
  if(ri===rows-1&&ci===Math.floor(cols/2)&&inW){return fv>.28?['▮',Math.max(.55,.88-fog*.4)]:['═',Math.max(.45,.75-fog*.4)];}
  if(!inW){if(fog<.22)return['█',Math.max(.55,.95-fog*.5)];if(fog<.48)return['▓',Math.max(.40,.78-fog*.5)];if(fog<.72)return['▒',Math.max(.22,.55-fog*.4)];return['░',Math.max(.10,.32-fog*.3)];}
  const rand=_pch(wx,wy,ci,ri,bv);const isLit=rand<lit;const hasB=(rand*17)%1<.18;
  if(isLit){const intensity=Math.max(.55,.95-fog*.30);if(hasB)return['≡',intensity*.85];return (rand*13)%1<.40?['▣',intensity]:['□',intensity*.92];}

}

// ================================================================ CV RAYCASTER RENDERER
function cvRender(P,W,H){

  for(let y=0;y<H>>1;y++){const idx=Math.min(CV_RAMP_CEIL.length-1,Math.floor(CV_RAMP_CEIL.length*y/(H>>1)));const c=CV_RAMP_CEIL[idx];if(y%3===0)for(let x=0;x<W;x+=4)buf[y][x]=c;}

    const camX=2*x/W-1,rdx=cam.dir[0]+cam.plane[0]*camX,rdy=cam.dir[1]+cam.plane[1]*camX;

    let hit=0,side=0,cell=0,iter=0;
    while(!hit&&iter<80){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0;}else{sdy+=ddy;my+=sy;side=1;}cell=router.getCell(mx,my);if(cell>0)hit=1;iter++;}
    const pd=Math.max(.1,side===0?(mx-cam.pos[0]+(1-sx)/2)/rdx:(my-cam.pos[1]+(1-sy)/2)/rdy);
    zbuf[x]=pd;
    const lh=Math.floor(H/(pd*eye));
    const ds=Math.max(0,Math.floor(-lh/2+H/2+voff)),de=Math.min(H-1,Math.floor(lh/2+H/2+voff));
    let wc=CV_RAMP_WALL[Math.min(CV_RAMP_WALL.length-1,Math.floor(pd*1.5))];
    if(cell===TERMINAL)wc='$';
    if(side===1&&wc!=='.'&&wc!==',')wc=wc===wc.toUpperCase()?':':wc;
    for(let y=ds;y<=de;y++)buf[y][x]=wc;
    for(let y=de+1;y<H;y++){const fi=Math.min(CV_RAMP_FLOOR.length-1,Math.floor((y-H/2)/Math.max(1,H/2)*(CV_RAMP_FLOOR.length-1)));if((x+y)%4===0)buf[y][x]=CV_RAMP_FLOOR[fi];}

  if(P.artifactItems){for(const[ax,ay,g,f]of P.artifactItems){if(f)continue;const dx=ax-cam.pos[0],dy=ay-cam.pos[1],inv=cam.plane[0]*cam.dir[1]-cam.dir[0]*cam.plane[1];if(Math.abs(inv)<1e-9)continue;const iD=1/inv,tX=iD*(cam.dir[1]*dx-cam.dir[0]*dy),tY=iD*(-cam.plane[1]*dx+cam.plane[0]*dy);if(tY<.3)continue;const sx=Math.floor(W/2*(1+tX/tY)),zi=Math.max(0,Math.min(W-1,sx));if(tY<zbuf[zi]&&sx>=0&&sx<W)buf[Math.floor(H/2)][sx]=g;}}

}
function _drawSprite(buf,zbuf,cam,ent,voff,W,H){

  const x1=Math.max(0,scrX-sW/2|0),x2=Math.min(W-1,scrX+sW/2|0);

      const ri=Math.min(Math.floor((by-y1)/rs*rows.length),rows.length-1);
      const ci=Math.floor((bx-x1)/rw*rows[ri].length)%Math.max(1,rows[ri].length);
      const sc=rows[ri][ci];buf[by][bx]=sc&&sc.trim()?sc:g;}}

}
function _drawSimple(buf,zbuf,cam,sx,sy,char,voff,W,H){
  const dx=sx-cam.pos[0],dy=sy-cam.pos[1];

// ================================================================ SPACE RENDERER (canvas 2D)
window.spaceRender=function(canvas,P,starfield,planetField,comets,audio,frame){
  const cam=P.craft;
  const W=canvas.width=canvas.clientWidth||SPACE_W,H=canvas.height=canvas.clientHeight||SPACE_H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);
  const proj=(wp)=>{const rel=vsub(wp,cam.pos),lx=vdot(rel,cam.right),ly=vdot(rel,cam.up),lz=vdot(rel,cam.fwd);if(lz<10)return null;const f=750/lz;return[W/2+lx*f,H/2-ly*f,f,lz];};
  const projBack=(wp)=>{const rel=vsub(wp,cam.pos),lx=vdot(rel,cam.right),ly=vdot(rel,cam.up),lz=vdot(rel,cam.fwd);if(lz>-10)return null;const f=750/Math.abs(lz)*.6;return[W/2-lx*f,H/2+ly*f,f,Math.abs(lz)];};
  const t=(text,x,y,color,size,bold)=>{ctx.fillStyle=color;ctx.font=`${bold?'bold ':'' }${size}px Courier,monospace`;ctx.fillText(text,x,y);};
  // ── Spaceship camera shake: persistent idle rumble + thrust/boost shake (−27%) ──
  if(!window._spShakeT)window._spShakeT=0;
  window._spShakeT+=0.055;
  const _st=window._spShakeT;
  // Idle rumble — always on, very slight
  const idleAmp=0.55;
  let sdx=Math.sin(_st*1.0)*idleAmp*0.6 + Math.sin(_st*2.3)*idleAmp*0.3 + (Math.random()-0.5)*idleAmp*0.4;
  let sdy=Math.cos(_st*0.8)*idleAmp*0.5 + Math.cos(_st*1.7)*idleAmp*0.25 + (Math.random()-0.5)*idleAmp*0.3;
  // Thrust layer — scales with velocity, reduced 27%
  if(cam.thrusterOn||cam.vel>2){
    const velFrac=Math.min(1,cam.vel/80);
    const thrustAmp=(2.5 + velFrac*11)*0.73;
    sdx+=(Math.random()-0.5)*thrustAmp + Math.sin(_st*4.1)*thrustAmp*0.55;
    sdy+=(Math.random()-0.5)*thrustAmp*0.9 + Math.cos(_st*3.7)*thrustAmp*0.5;
  }
  // Boost — violent jolt, also reduced 27%
  if(cam.boostOn){
    sdx+=(Math.random()-0.5)*13.1;
    sdy+=(Math.random()-0.5)*10.2;
  }
  // Motion blur amount: scales with thrust velocity
  const _blurAmt=(cam.thrusterOn||cam.vel>2)?Math.min(1,cam.vel/80):0;
  // speed streaks
  if(cam.vel>30){const inten=Math.min(1,(cam.vel-30)/290);const count=Math.floor(inten*20);for(let i=0;i<count;i++){const ang=Math.random()*TAU,r0=Math.random()*Math.min(W,H)*.05,r1=r0+(20+Math.random()*80)*inten;ctx.strokeStyle=inten>.5?'#ffaa00':'#8888ff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W/2+Math.cos(ang)*r0,H/2+Math.sin(ang)*r0);ctx.lineTo(W/2+Math.cos(ang)*r1,H/2+Math.sin(ang)*r1);ctx.stroke();}}
  // stars (forward + back projection) — blurred when thrusting
  let backCount=0;
  for(const[sx,sy,sz,g,col,fs]of starfield.near(cam.pos)){
    const r=proj([sx,sy,sz]);
    if(r){
      const[px,py,f]=r;
      if(px>=0&&px<=W&&py>=0&&py<=H){
        const starSize=Math.max(7,Math.min(fs,Math.floor(f*4)));
        if(_blurAmt>0.05){
          // Blur: draw the star multiple times with offset copies + reduced alpha
          const blurR=_blurAmt*4.5;
          const passes=Math.floor(2+_blurAmt*3); // 2–5 passes
          ctx.globalAlpha=Math.max(0.18,1-_blurAmt*0.55);
          t(f<.2?'.':g,px+sdx,py+sdy,col,starSize);
          ctx.globalAlpha=Math.max(0.08,_blurAmt*0.45);
          for(let _b=0;_b<passes;_b++){
            const bx=px+sdx+(Math.random()-0.5)*blurR;
            const by=py+sdy+(Math.random()-0.5)*blurR*0.5;
            t(f<.2?'.':g,bx,by,col,Math.max(6,starSize-1));
          }
          ctx.globalAlpha=1;
        } else {
          t(f<.2?'.':g,px+sdx,py+sdy,col,starSize);
        }
      }
    }
    else if(backCount<80){const rb=projBack([sx,sy,sz]);if(rb){const[px,py]=rb;if(px>=0&&px<=W&&py>=0&&py<=H){ctx.fillStyle=col;ctx.font='7px Courier,monospace';ctx.fillText('·',px,py);backCount++;}}}
  }
  // planets
  planetField.update();
  for(const p of planetField.planets){const r=proj(p.pos);if(!r)continue;const[px,py,f,dist]=r;const size=Math.max(2,Math.floor(p.size*f*.08));if(size>1&&px>=0&&px<=W&&py>=0&&py<=H){t(p.char.repeat(Math.max(1,size>>1)),px+sdx,py+sdy,p.color,Math.max(8,size>>1),true);if(dist<800)t(`[${BN[p.biome]}]`,px+sdx,py+size+12+sdy,p.color,8,false);}}

  // comets
  let cometWhoosh=false;
  for(const c of comets){const r=proj(c.pos);if(r){const[px,py,f]=r;if(px>=0&&px<=W&&py>=0&&py<=H){t('@',px+sdx,py+sdy,'#ffffff',Math.max(9,Math.floor(f*12)),true);if(f>.3)cometWhoosh=true;}}for(let i=0;i<c.tail.length;i++){const rt=proj(c.tail[i]);if(rt){const[px,py,f]=rt;if(px>=0&&px<=W&&py>=0&&py<=H){const fade=1-i/Math.max(1,c.tail.length);ctx.globalAlpha=fade;t(['@','%','#','*','+','·','.',' '][Math.min(i,7)],px+sdx,py+sdy,c.color,Math.max(7,Math.floor(f*10)));ctx.globalAlpha=1;}}}}
  if(cometWhoosh&&frame%60===0)audio.playSfx('whoosh');
  // HUD crosshair — perfectly aligned plus sign
  const col=cam.thrusterOn?'#ffcc00':'#ffb000';
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.5;
  // horizontal arms
  ctx.beginPath();ctx.moveTo(W/2-22,H/2);ctx.lineTo(W/2-6,H/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2+6,H/2);ctx.lineTo(W/2+22,H/2);ctx.stroke();
  // vertical arms
  ctx.beginPath();ctx.moveTo(W/2,H/2-22);ctx.lineTo(W/2,H/2-6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2,H/2+6);ctx.lineTo(W/2,H/2+22);ctx.stroke();
  // centre dot
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(W/2,H/2,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
  const vp=Math.min(1,Math.abs(cam.vel)/320),bw=200,fi=Math.floor(vp*bw/6);
  t(`[${'█'.repeat(fi)}${'░'.repeat(Math.floor(bw/6)-fi)}]`,W/2-bw/2,H-45,'#ffb000',9);
  t(`${cam.thrusterOn?'▶ THRUST ON':'  THRUST OFF'}${cam.boostOn?' ⚡BOOST':''}  |  V:${Math.floor(cam.vel)}  |  HP:${Math.floor(cam.health)} SH:${Math.floor(cam.shield)}  |  ${audio.mu?'♩':'♪'} ${audio.sx?'~':'x'}`,W/2-250,H-25,'#00ff88',11);
  t(`POS: ${cam.pos.map(v=>v.toFixed(0).padStart(8)).join(' ')}`,10,16,'#446644',9);
  // compass rose
  const ccx=W-70,ccy=70,cr=35;
  ctx.strokeStyle='#333333';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ccx,ccy,cr,0,TAU);ctx.stroke();
  const yawA=Math.atan2(cam.fwd[0],cam.fwd[2]),pitchA=Math.asin(Math.max(-1,Math.min(1,cam.fwd[1])));
  ctx.strokeStyle='#ffb000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ccx,ccy);ctx.lineTo(ccx+Math.sin(yawA)*cr*.8,ccy-Math.sin(pitchA)*cr*.8);ctx.stroke();
  ctx.fillStyle='#444444';ctx.font='8px Courier,monospace';ctx.fillText('HDG',ccx-10,ccy+cr+12);
  const near=planetField.nearest(cam.pos,600);
  if(near)t(`PLANET in range — [F] LAND (${BN[near.biome]}, d=${Math.floor(Math.sqrt(near.pos.reduce((s,v,i)=>(s+(v-cam.pos[i])**2),0)))})`,W/2-230,H-75,'#88ffaa',10,true);
  const be=P.nearestSpaceEnemy(300);
  if(be&&!P.campaignMode)t(`ENEMY SHIP in range — [G] BOARD (d=${Math.floor(Math.hypot(...vsub(cam.pos,be.pos)))})`,W/2-230,H-95,'#ff88aa',10,true);

};

// ================================================================ GAME ENGINE
class Game{

    this.planetField=new PlanetF();

    this.keys=new Set();
    this.frame=0;this.msg='';this.msgT=0;
    this._lmb=false;this._engCd=0;
    this.ov=null;this.ovs=0;this.lcode='';this.ovmsg='';
    this.opts={bright:3,autosave:true,gameSpeed:5,sensitivity:5}; // sliders 1-10, 5=100%

    this._engCd=0;

    setTimeout(()=>{if(!this.campaignMode)this.narrator.say('Omni Void Engine. Deep space. Navigate to a planet.');},1600);
  }
  _spawnClusters(){
    const rng=srng(WSEED^0xC0FFEE7);let eid=18;
    for(const p of this.planetField.planets){const[px,py,pz]=p.pos;for(let i=0;i<3+Math.floor(rng()*3);i++){const r=rng()*430+120,th=rng()*TAU,ph=rng()*2-1,sp=Math.sqrt(Math.max(0,1-ph*ph));this.P.spaceEnemies.push(new SpaceE(px+r*sp*Math.cos(th),py+r*ph,pz+r*sp*Math.sin(th),eid++));}}
  }
  showMsg(t,dur=2.5){this.msg=t;this.msgT=dur;}
  _respawnFoot(){
    const P=this.P;const[px,py]=P.pos();
    let bestT=null,bestD=1e9;
    for(const t of P.terminals){const d=Math.hypot(px-t.x,py-t.y);if(d<bestD){bestD=d;bestT=t;}}
    const router=P.router||P.boardRouter;
    let ox,oy;
    if(bestT&&router)[ox,oy]=P._openSpawn(router,bestT.x,bestT.y);
    else[ox,oy]=P._openSpawn(router||{isOpen:()=>true});
    P.cv.pos=[ox||P._ckX,oy||P._ckY];P.cv.health=P.cv.maxHealth;P.cv.shield=P.cv.maxShield;
    P.heat=0;P.overheated=false;
    this.showMsg('>>> DOWN — RESPAWNING AT CHECKPOINT');this.audio.playSfx('death');
  }

  update(dt){
    const P=this.P,m=P.mode;
    const cp=P.pos();if(this._ppos){const d=Math.hypot(cp[0]-this._ppos[0],cp[1]-this._ppos[1]);if(m==='foot'||m==='board')this.stats.d_foot+=d;else if(m==='vehicle')this.stats.d_rover+=d;else this.stats.d_space+=d;}this._ppos=cp;
    if(this.cheats.unlim_hp){P.cv.health=P.cv.maxHealth;P.veh.health=P.veh.maxHealth;P.craft.health=P.craft.maxHealth;}
    if(this.ov)return;
    if(m==='foot'||m==='board'){
      if(!P.logOpen){
        this._updateFoot(dt);this._updateEmitter();
        const sm=P.powerups.SLOW_TIME>0?.25:1;
        const _camP=P.cv;const _camProxy={pos:_camP.pos,get health(){return _camP.health;},set health(v){_camP.health=v;}};
        for(const e of P.entities){e.speed=(ESPD[e.char]||.02)*sm;e.update(_camProxy,P.router||P.boardRouter);}
        this._checkEntEvents();
        if(this.combat&&P.cv.health<=0)this._respawnFoot();
        P.particles=P.particles.filter(p=>{if(p.length>4){p[0]+=p[4]||0;p[1]+=p[5]||0;}p[3]--;return p[3]>0;});
        P.puItems=P.puItems.filter(pu=>pu[3]-->0);
        for(const k in P.powerups)if(P.powerups[k]>0)P.powerups[k]--;
        if(P.puT>0)P.puT--;
        const[px,py]=P.pos();const art=P.checkArtifacts(px,py);if(art){this.stats.logs++;this.showMsg('>>> ARTIFACT FOUND — [L] to read');this.audio.playSfx('artifact');}
        const shard=P.worldBubble.tick(P);if(shard){this.stats.logs++;this.showMsg('>>> LOG SHARD RECOVERED — [L] to read');this.audio.playSfx('artifact');}
        P.entities=P.entities.filter(e=>!(e.state==='DEAD'&&e.deadT<=0));
        if(this.frame%40===0&&!this.cheats.no_enemies){const alive=P.entities.filter(e=>e.alive()).length;if(alive<Math.max(4,P.entities.length/3)){const[ex,ey]=P._openSpawn(P.router||P.boardRouter,P.pos()[0]+Math.random()*36-18,P.pos()[1]+Math.random()*36-18);P.entities.push(new Ent(ex,ey,ECHARS[Math.floor(Math.random()*ECHARS.length)]));}}
      }
      this.audio.setMode(m==='board'?'ENEMY SHIP':(BN[P.biome]||'OPEN WILDS'));
    }else if(m==='vehicle'){
      this._updateVehicle(dt);this._updateVehEmitter();
      const sm=P.powerups.SLOW_TIME>0?.25:1;
      const _vehP=P.veh;for(const e of P.entities){e.speed=(ESPD[e.char]||.02)*sm;const vc={pos:[_vehP.x,_vehP.y],get health(){return _vehP.health;},set health(v){_vehP.health=v;}};e.update(vc,P.router);}
      P.entities=P.entities.filter(e=>!(e.state==='DEAD'&&e.deadT<=0));
      if(P.veh.health<=0){P.veh.health=P.veh.maxHealth;P.veh.speed=0;const[ox,oy]=P._openSpawn(P.router,P._ckX,P._ckY);P.cv.pos=[ox,oy];P.cv.health=P.cv.maxHealth;P.mode='foot';this.keys.clear();this.audio.stopEngine();this.showMsg('>>> VEHICLE DESTROYED — RESPAWNING');}
      else{this.audio.startEngine(P.veh.rpm,P.veh.RPM_REDLINE);}
      P.worldBubble.tick(P);
      this.audio.setMode(BN[P.biome]||'OPEN WILDS');
    }else if(m==='space'){
      for(const e of P.spaceEnemies)e.update(P.craft.pos,dt);
      if(this.frame%180===0&&!this.campaignMode){for(const e of P.spaceEnemies.filter(e=>!e.alive()).slice(0,3)){e.pos=e.pos.map(v=>v+(Math.random()*4000-2000));e.hp=e.maxHp;e.alive_flag=true;e.fCd=2;}}
      P.craft.update(dt,this.keys);
      if(this.frame%30===0)P.craft.reortho();
      if(P.craft.thrusterOn&&this.frame%25===0)this.audio.playSfx('thruster');
      if(this.comets.length<8&&Math.random()<.04)this.comets.push(new Comet(P.craft.pos,P.craft.fwd));
      for(const c of this.comets)c.update();this.comets=this.comets.filter(c=>c.alive());
      this.audio.setMode('space');
      // Start space idle drone if not running
      if(!this.audio._droneNodes)this.audio.startSpaceDrone();
    }
    // Stop space drone when not in space
    if(m!=='space'&&this.audio._droneNodes)this.audio.stopSpaceDrone();
    this.msgT=Math.max(0,this.msgT-dt);
    if(m==='foot'||m==='board'){P.cv.health=Math.min(P.cv.maxHealth,P.cv.health+.008);P.cv.shield=Math.min(P.cv.maxShield,P.cv.shield+.04);}
    else if(m==='vehicle'){P.veh.health=Math.min(P.veh.maxHealth,P.veh.health+.04);P.veh.shield=Math.min(P.veh.maxShield,P.veh.shield+.09);}
    else{P.craft.health=Math.min(P.craft.maxHealth,P.craft.health+.06);P.craft.shield=Math.min(P.craft.maxShield,P.craft.shield+.12);}
    this.frame++;
  }

  _updateFoot(dt){
    const P=this.P,cam=P.cv,router=P.router||P.boardRouter;if(!router)return;
    const sprint=this.keys.has('Shift'),pu=P.powerups;
    // Movement: a/d strafe at 1/3 of fwd speed. gsMult from slider.
    const gsMult=(this.opts.gameSpeed/5);
    const fwdSpd=sprint?3.6:2.7,strafeSpd=fwdSpd/3;
    const fwdS=fwdSpd*gsMult*(pu.SPEED_BOOST>0?2:1)*(pu.SLOW_TIME>0?.4:1)*dt;
    const strS=strafeSpd*gsMult*(pu.SPEED_BOOST>0?2:1)*(pu.SLOW_TIME>0?.4:1)*dt;
    let moving=false;
    const mv=(dx,dy)=>{const nx=cam.pos[0]+dx,ny=cam.pos[1]+dy;if(router.isOpen(nx,cam.pos[1]))cam.pos[0]=nx;if(router.isOpen(cam.pos[0],ny))cam.pos[1]=ny;};
    if(this.keys.has('w')||this.keys.has('ArrowUp')){mv(cam.dir[0]*fwdS,cam.dir[1]*fwdS);moving=true;}
    if(this.keys.has('s')||this.keys.has('ArrowDown')){mv(-cam.dir[0]*fwdS,-cam.dir[1]*fwdS);moving=true;}
    if(this.keys.has('a')){mv(-cam.dir[1]*strS,cam.dir[0]*strS);moving=true;}
    if(this.keys.has('d')){mv(cam.dir[1]*strS,-cam.dir[0]*strS);moving=true;}
    // Rotation: 1.5 rad/sec at slider-5 (100%). Slider 1=20%, 10=200%.
    const sensMult=(this.opts.sensitivity/5);
    const rot=1.5*sensMult*dt;
    if(this.keys.has('ArrowLeft'))cam.rotate(-rot);
    if(this.keys.has('ArrowRight'))cam.rotate(rot);
    if(this.keys.has('PageUp')&&!P.logOpen)cam.pitch=Math.min(14,cam.pitch+3);
    if(this.keys.has('PageDown')&&!P.logOpen)cam.pitch=Math.max(-14,cam.pitch-3);
    if(!this.keys.has('PageUp')&&!this.keys.has('PageDown'))cam.pitch*=.88;
    if(!cam.jumping)cam.stepBob(moving);else cam.bob*=.85;
    const landed=cam.updateJump();
    if(landed){cam.sAmp=6;cam.sF=14;this.audio.playSfx('land');}
    if(moving&&!cam.jumping){P._stepCd--;if(P._stepCd<=0){this.audio.playSfx('step');P._stepCd=22;}}
    const[px,py]=P.pos();for(let i=P.puItems.length-1;i>=0;i--){const pu=P.puItems[i];if(Math.hypot(pu[0]-px,pu[1]-py)<1.1){P.powerups[pu[2]]=PU_DUR;P.puWord=PLABELS[pu[2]];P.puT=55;P.puItems.splice(i,1);this.audio.playSfx('pickup');break;}}
  }

  _updateEmitter(){
    const P=this.P,cam=P.cv;if(P.mode!=='foot'&&P.mode!=='board')return;
    if(this.cheats.unlim_emit){P.heat=0;P.overheated=false;}
    const firing=this.keys.has(' ')||this._lmb;
    if(firing&&!P.overheated){
      const rate=P.powerups.RAPID_FIRE>0?.35:1;
      P.heat=Math.min(100,P.heat+3.8*rate);
      if(P.heat>=100){P.overheated=true;this.audio.playSfx('overheat');this.showMsg('EMITTER JAMMED — cool down');}
      else{
        if(this.frame%3===0)this.audio.playSfx('gun');
        this._fireEmitter();
        for(let i=0;i<5;i++){const pc='*+.'[Math.floor(Math.random()*3)];P.particles.push([(GRID_W>>1)+Math.floor(Math.random()*7)-3,(GRID_H>>1)+Math.floor(Math.random()*5)-2,pc,8+Math.floor(Math.random()*7),Math.floor(Math.random()*3)-1,Math.floor(Math.random()*3)-1]);}
      }
    }else{P.heat=Math.max(0,P.heat-2.2);if(P.heat<=0&&P.overheated){P.overheated=false;this.showMsg('EMITTER READY');}}
  }
  _fireEmitter(){
    const P=this.P,cam=P.cv;let best=null,bestD=999;
    for(const e of P.entities){if(!e.alive()||e.pac)continue;const dx=e.x-cam.pos[0],dy=e.y-cam.pos[1],d=Math.hypot(dx,dy);if(d<.5||d>40)continue;const dot=cam.dir[0]*(dx/d)+cam.dir[1]*(dy/d);if(dot>.96&&d<bestD){best=e;bestD=d;}}
    if(best){best.hit();
      for(let i=0;i<5;i++){const pc='*+.'[Math.floor(Math.random()*3)];P.particles.push([(GRID_W>>1)+Math.floor(Math.random()*9)-4,(GRID_H>>1)+Math.floor(Math.random()*5)-2,pc,6+Math.floor(Math.random()*5),Math.floor(Math.random()*3)-1,Math.floor(Math.random()*3)-1]);}
      if(best.conf>0)for(let i=0;i<3;i++)P.particles.push([(GRID_W>>1)+Math.floor(Math.random()*7)-3,(GRID_H>>1)+Math.floor(Math.random()*5)-2,'.,:'[Math.floor(Math.random()*3)],5,0,-1]);}
  }
  _updateVehEmitter(){
    const P=this.P,cam=P.veh;if(this.cheats.unlim_emit){cam.heat=0;cam.overheated=false;}
    const firing=this.keys.has(' ')||this._lmb;
    if(firing&&!cam.overheated){cam.heat=Math.min(100,cam.heat+3.0);if(cam.heat>=100){cam.overheated=true;this.audio.playSfx('overheat');this.showMsg('TURRET JAMMED — cool down');}else{if(this.frame%3===0)this.audio.playSfx('gun');this._fireVehEmitter();}}
    else{cam.heat=Math.max(0,cam.heat-1.8);if(cam.heat<=0&&cam.overheated){cam.overheated=false;this.showMsg('TURRET READY');}}
  }
  _fireVehEmitter(){
    const P=this.P,veh=P.veh,a=veh.renderAngle,fx=Math.cos(a),fy=Math.sin(a);
    let best=null,bd=999;for(const e of P.entities){if(!e.alive()||e.pac)continue;const dx=e.x-veh.x,dy=e.y-veh.y,d=Math.hypot(dx,dy);if(d<.5||d>28)continue;const dot=fx*(dx/d)+fy*(dy/d);if(dot>.94&&d<bd){best=e;bd=d;}}
    if(best)best.hit();
  }
  _checkEntEvents(){
    const P=this.P;
    for(const e of P.entities){if(e.alive()&&!e.pac&&e.state==='ATTACK'){this._hitDir=Math.atan2(e.y-P.cv.pos[1],e.x-P.cv.pos[0]);this._hitDirT=18;break;}}
    if(this._hitDirT>0)this._hitDirT--;
    let stilled=0;for(const e of P.entities){if(e.nPac){stilled++;e.nPac=false;}}
    if(stilled){this.stats.stilled+=stilled;this.audio.playSfx('still');}
  }
  _updateVehicle(dt){
    const P=this.P;
    const th=this.keys.has('w')||this.keys.has('ArrowUp')?1:0;
    const br=this.keys.has('s')||this.keys.has('ArrowDown')?1:0;
    const st=(this.keys.has('a')?-1:0)+(this.keys.has('d')?1:0);
    const bo=this.keys.has('Shift');
    const yL=this.keys.has('ArrowLeft'),yR=this.keys.has('ArrowRight');
    const router=P.vehRouter||P.router;
    const prev=P.veh.speed;
    P.veh.update(dt,th,br,st,bo,yL,yR,router);
    const spd=P.veh.speed;
    if(this._engCd>0){this._engCd--;}else{
      if(spd>prev+.5&&spd>.3){this.audio.playSfx('accel');this._engCd=25;}
      else if(spd<prev-.8&&prev>2){this.audio.playSfx('brake');this._engCd=20;}
      else if(spd<-.3&&prev>-.3){this.audio.playSfx('reverse');this._engCd=30;}
      else if(this.frame%20===0){const rn=(P.veh.rpm-P.veh.RPM_IDLE)/(P.veh.RPM_REDLINE-P.veh.RPM_IDLE);if(rn<.04){this.audio.playSfx('engine_idle');this._engCd=22;}else if(rn<.35){this.audio.playSfx('engine_lo');this._engCd=18;}else if(rn<.7){this.audio.playSfx('engine_md');this._engCd=18;}else{this.audio.playSfx('engine_hi');this._engCd=16;}}
    }
  }

  onKey(k,down){
    if(!down){this.keys.delete(k);if(k==='b'&&this.P.mode==='space')this.P.craft.boostOn=false;return;}
    this.keys.add(k);
    if(this.ov){this._ovKey(k);return;}
    const P=this.P;
    // log scroll — arrow keys, consumed here so game doesn't move
    if(P.logOpen){
      if(k==='ArrowUp'||k==='ArrowDown'){
        const el=document.getElementById('log-inner');
        if(el)el.scrollBy({top:k==='ArrowUp'?-80:80,behavior:'smooth'});
        return;
      }
      if(k==='PageUp'||k==='PageDown'){
        const el=document.getElementById('log-inner');
        if(el)el.scrollBy({top:k==='PageUp'?-300:300,behavior:'smooth'});
        return;
      }
    }
    if(k==='Enter'){this.ov='pause';this.ovs=0;this.ovmsg='';return;}
    if(k==='Escape'){this.ov='pause';this.ovs=0;this.ovmsg='';return;}
    if(k===' '&&P.mode==='space'){P.craft.thrusterOn=!P.craft.thrusterOn;if(P.craft.thrusterOn)this.audio.startThruster();else this.audio.stopThruster();this.showMsg(`THRUST ${P.craft.thrusterOn?'ON':'OFF'}`);}
    else if((k==='j'||k==='g')&&(P.mode==='foot'||P.mode==='board')){P.cv.jump();this.audio.playSfx('jump');}
    else if(k==='b'&&P.mode==='space'){P.craft.boostOn=true;this.audio.playSfx('boost');this.showMsg('BOOST');}
    else if(k==='e')this._interact();
    else if(k==='f')this._fKey();
    else if(k==='g')this._board();
    else if(k==='x'&&P.mode==='board')this._disembark();
    else if(k==='t')this._teleport();
    else if(k==='l'){P.logOpen=!P.logOpen;if(P.logOpen){P.logScroll=0;setTimeout(()=>{const el=document.getElementById('log-inner');if(el)el.scrollTop=0;},0);}}
    else if(k==='m'&&(P.mode==='foot'||P.mode==='board'||P.mode==='vehicle')){this._spawnEnemyWave();}
    else if(k==='M'&&P.mode==='space'){V01DA.toggle();this.showMsg(`MUSIC ${V01DA.isOn()?'ON':'OFF'}`);}
    else if(k==='v'&&(P.mode==='foot'||P.mode==='board'||P.mode==='vehicle')){this._spawnVehicleWave();}
    else if(k==='r')this.showMsg(`SFX ${this.audio.toggleSfx()?'ON':'OFF'}`);
  }
  _interact(){
    const P=this.P;
    if(P.mode==='foot'){if(P.distTerminal()<2&&P.useTerminal()){this.showMsg('>>> TERMINAL: HP/SH restored');this.audio.playSfx('pickup');return;}const nv=P.nearestVehicle();if(nv){const[px,py]=P.pos();if(Math.hypot(px-nv.x,py-nv.y)<5){P.enterVehicle(nv.id);this.stats.vehicles++;this.showMsg(`>>> ENTER ${nv.kind==='ship'?'SHIP':'VEHICLE'} #${nv.id}  [E to exit]`);this.audio.playSfx('pickup');}}}
    else if(P.mode==='vehicle'){P.exitVehicle();this.keys.clear();this.audio.stopEngine();this.showMsg('>>> EXIT VEHICLE');}
    else if(P.mode==='board'&&P.distTerminal()<2){this.showMsg('>>> BRIDGE CAPTURED — [X] to disembark');}
  }
  _fKey(){
    const P=this.P;
    if(P.mode==='space'){
      const near=this.planetField.nearest(P.craft.pos,600);
      if(near){
        if(this.campaignMode){
          // In campaign space chapter: landing on a PLANET advances the story
          this.audio.playSfx('pickup');
          this.narrator.say(`Landed. ${BN[near.biome]}.`);
          this.audio.stop();this.narrator.stop();
          if(this.onQuit)this.onQuit();
          return;
        }
        P.land(near);this.showMsg(`>>> LANDED on ${BN[near.biome]}`);this.audio.playSfx('pickup');this.narrator.say(`Landed. ${BN[near.biome]}.`);
      }
    }
    else if(P.mode==='foot'||P.mode==='vehicle'){if(P.mode==='vehicle'){P.exitVehicle();this.keys.clear();this.audio.stopEngine();}P.takeoff();this.showMsg('>>> TAKEOFF');this.audio.playSfx('thruster');this.narrator.say('Launching.');}
  }
  _board(){const P=this.P;if(P.mode!=='space')return;if(this.campaignMode){this.showMsg('>>> BOARDING DISABLED IN CAMPAIGN');return;}const t=P.nearestSpaceEnemy(300);if(t){P.boardShip(t);this.stats.ships++;this.showMsg(`>>> BOARDING SHIP #${t.eid}`);this.audio.playSfx('pickup');this.narrator.say('Boarding enemy vessel.');}}
  _disembark(){this.P.disembark();this.showMsg('>>> DISEMBARKED');this.audio.playSfx('pickup');this.narrator.say('Disembarked.');}
  _teleport(){
    const P=this.P;
    if(P.mode==='board'){P.disembark();this.showMsg('>>> DISEMBARKED — land again to teleport');this.audio.playSfx('pickup');return;}
    if(P.mode==='vehicle'){P.exitVehicle();this.keys.clear();this.audio.stopEngine();}
    if(P.mode==='foot'||P.mode==='vehicle'){
      const r=P.router;
      if(!r){P.teleportToShip()?this.showMsg('>>> TELEPORTING TO SHIP'):this.showMsg('>>> NO SHIP FOUND');return;}
      // Try near ship first, then full map scan — guarantees escape from any box
      const ship=P.vehicles.find(v=>v.kind==='ship');
      const[cx,cy]=ship?[ship.x,ship.y]:[50,50];
      const[tx,ty]=P._openSpawn(r,cx,cy);
      if(r.isOpen(tx,ty)){P.cv.pos=[tx,ty];this.showMsg('>>> TELEPORTED — near landing zone');this.audio.playSfx('pickup');}
      else{P.teleportToShip()?this.showMsg('>>> TELEPORTING TO SHIP'):this.showMsg('>>> NO OPEN SPACE FOUND');}
    }
  }
  _spawnEnemyWave(){
    const P=this.P;const router=P.router||P.boardRouter;if(!router)return;
    const[px,py]=P.pos();const kinds={[DUNGEON]:['Z','D','G','B'],[CITY]:['Z','G','M'],[WILDS]:['G','Z','S'],[MOON]:['D','S']}[P.biome]||['Z','G','B'];
    let spawned=0;
    for(let i=0;i<6;i++){const ang=Math.random()*TAU,r=4+Math.random()*10,x=px+Math.cos(ang)*r,y=py+Math.sin(ang)*r;const[ox,oy]=P._openSpawn(router,x,y);if(router.isOpen(ox,oy)){P.entities.push(new Ent(ox,oy,kinds[Math.floor(Math.random()*kinds.length)]));spawned++;}}
    this.showMsg(`>>> +${spawned} ENEMIES INBOUND`);this.audio.playSfx('death');
  }
  _spawnVehicleWave(){
    const P=this.P;const router=P.router||P.boardRouter;if(!router)return;
    const[px,py]=P.pos();let spawned=0;
    const nid=Math.max(0,...P.vehicles.map(v=>v.id),0)+1;
    for(let i=0;i<4;i++){const ang=Math.random()*TAU,r=5+Math.random()*12,x=px+Math.cos(ang)*r,y=py+Math.sin(ang)*r;const[ox,oy]=P._openSpawn(router,x,y);if(router.isOpen(ox,oy)){P.vehicles.push({id:nid+i,x:ox,y:oy,angle:Math.random()*TAU,kind:'vehicle'});spawned++;}}
    this.showMsg(`>>> +${spawned} VEHICLES DEPLOYED`);this.audio.playSfx('pickup');
  }
  _ovKey(k){
    if(this.ov==='pause'){
      const items=['RESUME','SAVE GAME','LOAD GAME','OPTIONS','STATS',this.campaignMode?'CONTINUE CAMPAIGN':'QUIT TO MAIN MENU'];const n=items.length;
      if(k==='ArrowUp'||k==='w')this.ovs=(this.ovs-1+n)%n;
      else if(k==='ArrowDown'||k==='s')this.ovs=(this.ovs+1)%n;
      else if(k==='Enter'||k===' '){
        const ch=items[this.ovs];
        if(ch==='RESUME')this.ov=null;
        else if(ch==='SAVE GAME'){this.ov='save';this.ovs=0;this.ovmsg='';}
        else if(ch==='LOAD GAME'){this.ov='load';this.ovs=0;this.lcode='';this.ovmsg='';}
        else if(ch==='OPTIONS'){this.ov='options';this.ovs=0;}
        else if(ch==='STATS'){this.ov='stats';this.ovs=0;}
        else if(ch==='QUIT TO MAIN MENU'||ch==='CONTINUE CAMPAIGN'){if(this.opts.autosave)SM.save(4,this._captureState());this.audio.stop();this.narrator.stop();if(this.onQuit)this.onQuit();}
      }else if(k==='Escape')this.ov=null;
    }else if(this.ov==='options'){
      const n=8;
      if(k==='ArrowUp'||k==='w')this.ovs=(this.ovs-1+n)%n;
      else if(k==='ArrowDown'||k==='s')this.ovs=(this.ovs+1)%n;
      else if(k==='Enter'||k==='ArrowLeft'||k==='ArrowRight'){
        const d=k==='ArrowLeft'?-1:1;
        if(this.ovs===0)this.opts.bright=Math.max(0,Math.min(4,this.opts.bright+d));
        else if(this.ovs===1){this.opts.gameSpeed=Math.max(1,Math.min(10,this.opts.gameSpeed+d));this.showMsg('GAME SPEED: '+Math.round(this.opts.gameSpeed/5*100)+'%');}
        else if(this.ovs===2){this.opts.sensitivity=Math.max(1,Math.min(10,this.opts.sensitivity+d));this.showMsg('SENSITIVITY: '+Math.round(this.opts.sensitivity/5*100)+'%');}
        else if(this.ovs===3){V01DA.setVol(V01DA.getVol()>0?0:1);this.showMsg('MUSIC '+(V01DA.volPct()>0?V01DA.volPct()+'%':'OFF'));}
        else if(this.ovs===4)this.showMsg('SFX '+(this.audio.toggleSfx()?'ON':'OFF'));
        else if(this.ovs===5)this.opts.autosave=!this.opts.autosave;
        else if(this.ovs===6){this.ov='cheats';this.ovs=0;}
        else if(this.ovs===7){this.ov='pause';this.ovs=3;}
        // ←→ in options: adjust music volume when on MUSIC item (ovs=3)
      }else if((k==='ArrowLeft'||k==='ArrowRight')&&this.ovs===3){
        const d=k==='ArrowRight'?0.1:-0.1;V01DA.setVol(V01DA.getVol()+d);this.showMsg('MUSIC VOL: '+V01DA.volPct()+'%');
      }else if(k==='Escape'){this.ov='pause';this.ovs=3;}
    }else if(this.ov==='cheats'){
      const n=4;
      if(k==='ArrowUp'||k==='w')this.ovs=(this.ovs-1+n)%n;
      else if(k==='ArrowDown'||k==='s')this.ovs=(this.ovs+1)%n;
      else if(k==='Enter'||k===' '){
        if(this.ovs===0)this.cheats.unlim_hp=!this.cheats.unlim_hp;
        else if(this.ovs===1)this.cheats.unlim_emit=!this.cheats.unlim_emit;
        else if(this.ovs===2){this.cheats.no_enemies=!this.cheats.no_enemies;if(this.cheats.no_enemies){this.P.entities=[];this.P.spaceEnemies=[];}}
        else if(this.ovs===3){this.ov='options';this.ovs=6;}
      }else if(k==='Escape'){this.ov='options';this.ovs=6;}
    }else if(this.ov==='stats'){this.ov='pause';this.ovs=4;
    }else if(this.ov==='save'||this.ov==='load'){
      const n=6;
      if(k==='ArrowUp'||k==='w')this.ovs=(this.ovs-1+n)%n;
      else if(k==='ArrowDown'||k==='s')this.ovs=(this.ovs+1)%n;
      else if(k==='Escape'){const c=this.ov;this.ov='pause';this.ovs=c==='save'?1:2;}
      else if(this.ov==='load'&&k.length===1&&'0123456789ABCDEFGHJKLMNPQRSTUVWXYZ'.includes(k.toUpperCase())){if(this.lcode.length<8)this.lcode+=k.toUpperCase();}
      else if(this.ov==='load'&&k==='Backspace')this.lcode=this.lcode.slice(0,-1);
      else if(k==='Enter'){
        if(this.ovs===5){const c=this.ov;this.ov='pause';this.ovs=c==='save'?1:2;return;}
        if(this.ov==='save'){const pc=SM.save(this.ovs,this._captureState());this.ovmsg='SAVED — PASSCODE: '+pc;}
        else{let st=this.lcode?SM.byCode(this.lcode):null;if(!st)st=SM.load(this.ovs);if(st){this._applyState(st);this.ov=null;this.showMsg('>>> GAME LOADED');}else this.ovmsg='NO SAVE FOUND';}
      }
    }
  }
  _captureState(){
    const P=this.P;
    return{mode:P.mode,craft_pos:[...P.craft.pos],craft_fwd:[...P.craft.fwd],craft_up:[...P.craft.up],craft_rt:[...P.craft.right],cv_x:P.cv.pos[0],cv_y:P.cv.pos[1],cv_dx:P.cv.dir[0],cv_dy:P.cv.dir[1],cv_hp:P.cv.health,cv_sh:P.cv.shield,planet:P.planet,biome:P.biome,logs:[...P.logEntries],stats:{...this.stats},opts:{...this.opts},cheats:{...this.cheats},combat:this.combat};
  }
  _applyState(st){
    const P=this.P;
    if(st.craft_pos)P.craft.pos=[...st.craft_pos];if(st.craft_fwd)P.craft.fwd=[...st.craft_fwd];if(st.craft_up)P.craft.up=[...st.craft_up];if(st.craft_rt)P.craft.right=[...st.craft_rt];P.craft.reortho();
    P.cv.pos=[st.cv_x||50,st.cv_y||50];P.cv.dir=[st.cv_dx||-1,st.cv_dy||0];P.cv.plane=[-P.cv.dir[1]*.66,P.cv.dir[0]*.66];
    P.cv.health=st.cv_hp||100;P.cv.shield=st.cv_sh||50;
    if(st.logs)P.logEntries=[...st.logs];
    if(st.stats)Object.assign(this.stats,st.stats);
    if(st.opts)Object.assign(this.opts,st.opts);
    if(st.cheats)Object.assign(this.cheats,st.cheats);
    if(st.combat!==undefined)this.combat=st.combat;
    if(st.planet&&st.biome!=null&&(st.mode==='foot'||st.mode==='vehicle')){try{P.land(st.planet);}catch{P.mode='space';}}else P.mode='space';
    this._ppos=null;this.audio.setMode(P.mode==='space'?'space':(BN[P.biome]||'OPEN WILDS'));
  }
  renderOv(){
    const W=62,sel=(i,l)=>(i===this.ovs?'▶ '+l:'  '+l).padEnd(W),tog=v=>v?'[ON] ':'[OFF]';
    const box=(t,ls)=>{const H='═'.repeat(W);return['╔'+H+'╗','║'+t.padStart((W+t.length)/2|0).padEnd(W)+'║','╠'+H+'╣',...ls.map(l=>'║'+l.padEnd(W)+'║'),'╚'+H+'╝'].join('\n');};
    if(this.ov==='pause'){const items=['RESUME','SAVE GAME','LOAD GAME','OPTIONS','STATS',this.campaignMode?'CONTINUE CAMPAIGN':'QUIT TO MAIN MENU'];const ls=items.map((x,i)=>sel(i,x));if(this.ovmsg)ls.push('','  '+this.ovmsg);ls.push('','  [ENTER] select   [ESC] resume');return box('P A U S E D',ls);}
    if(this.ov==='options'){const b='█'.repeat(this.opts.bright)+'░'.repeat(4-this.opts.bright);const gs=this.opts.gameSpeed;const gsBar='█'.repeat(gs)+'░'.repeat(10-gs);const gsPct=Math.round(gs/5*100);const sn=this.opts.sensitivity;const snBar='█'.repeat(sn)+'░'.repeat(10-sn);const snPct=Math.round(sn/5*100);const items=['BRIGHTNESS   ['+b+'] '+(this.opts.bright+1)+'/5','GAME SPEED   ['+gsBar+'] '+gsPct+'%  '+(gs===5?'(default)':gs<5?'(slower)':'(faster)'),'SENSITIVITY  ['+snBar+'] '+snPct+'%  '+(sn===5?'(default)':sn<5?'(slower)':'(faster)'),'MUSIC        '+tog(this.audio.mu),'SFX          '+tog(this.audio.sx),'AUTOSAVE     '+tog(this.opts.autosave),'CHEAT CODES','BACK'];const ls=items.map((x,i)=>sel(i,x));ls.push('','  [◄/►] adjust   [ENTER] toggle   [ESC] back');return box('O P T I O N S',ls);}
    if(this.ov==='cheats'){const items=['UNLIMITED HEALTH  '+tog(this.cheats.unlim_hp),'INFINITE EMITTER  '+tog(this.cheats.unlim_emit),'ENEMIES OFF       '+tog(this.cheats.no_enemies),'BACK'];const ls=items.map((x,i)=>sel(i,x));ls.push('','  [ENTER] toggle   [ESC] back');return box('C H E A T S',ls);}
    if(this.ov==='stats'){const s=this.stats;const ls=['  LOGS COLLECTED    '+s.logs,'  ENEMIES STILLED   '+s.stilled,'  VEHICLES DRIVEN   '+s.vehicles,'  SHIPS BOARDED     '+s.ships,'  DIST ON FOOT      '+(s.d_foot*.003).toFixed(2)+'km','  DIST BY ROVER     '+(s.d_rover*.003).toFixed(2)+'km','  DIST IN SPACE     '+(s.d_space*.0003).toFixed(2)+'km','',sel(0,'BACK')];return box('S T A T S',ls);}
    if(this.ov==='save'||this.ov==='load'){const tit=this.ov==='save'?'S A V E  G A M E':'L O A D  G A M E';const slots=SM.all();const ls=slots.slice(0,4).map((sl,i)=>sel(i,'SLOT '+(i+1)+'  '+(sl?'['+sl.ts+']  PC:'+sl.passcode:'[EMPTY]')));const asl=slots[4];ls.push(sel(4,'AUTOSAVE  '+(asl?'['+asl.ts+']  PC:'+asl.passcode:'[EMPTY]')));if(this.ov==='load')ls.push('','  PASSCODE: ['+this.lcode+'_]','  type code + ENTER  or  select slot + ENTER');ls.push('',sel(5,'BACK'));if(this.ovmsg)ls.push('','  '+this.ovmsg);return box(tit,ls);}
    return '';
  }
  quit(){if(this.opts.autosave)SM.save(4,this._captureState());this.audio.stop();this.narrator.stop();if(this.onQuit)this.onQuit();}
}

  init(){try{this._d=JSON.parse(localStorage.getItem(SM_FR_KEY))||{slots:Array(5).fill(null)};}catch{this._d={slots:Array(5).fill(null)};}},
  _w(){try{localStorage.setItem(SM_FR_KEY,JSON.stringify(this._d));}catch{}},

  ctrl.innerHTML=`<b>ON FOOT</b><br>WASD / arrows move/turn  J jump  SHIFT sprint  SPACE emitter  E interact  F takeoff  T teleport  L log  M spawn enemies  V spawn vehicles<br><br><b>VEHICLE</b><br>W/S throttle  A/D steer  ◄► look  SHIFT boost  SPACE fire  E exit<br><br><b>SPACE</b><br>WASD pitch/yaw  QE roll  arrows strafe  SPACE thrust  B boost  F land  G board<br><br><b>PYSPLORE</b><br>Accessible from main menu or as Chapter 3. ESC to exit. DAW step sequencer · Paint · Journal · Clock · Calculator · Chess · Checkers.<br><br><b>STORY MODE</b><br>Chapter 1 (DRIFT): fly to a planet, press F to land and advance. Auto-advances after 10 min.<br>Chapter 3 (PYSPLORE): explore the relic OS. ESC when done.<br>Other chapters: ENTER → CONTINUE CAMPAIGN when ready to leave.<br><br><b>FREE ROAM</b><br>ENTER pause menu  R sfx  ESC quit`;
  itemsEl.appendChild(ctrl);
  _item('BACK',true,()=>{menuSection='root';menuSel=0;buildMenu();});
}
document.addEventListener('keydown',e=>{
  if(G||_campaignRunning)return;
  const isLoad=menuSection==='frLoad'||menuSection==='stLoad';
  if(isLoad){
    const n=6;
    if(e.key==='ArrowUp'||e.key==='w'){menuSel=(menuSel-1+n)%n;buildMenu();}
    else if(e.key==='ArrowDown'||e.key==='s'){menuSel=(menuSel+1)%n;buildMenu();}
    else if(e.key==='Enter'){menuSection==='frLoad'?_frLoadConfirm(menuSel):_stLoadConfirm(menuSel);}
    else if(e.key.length===1&&'0123456789ABCDEFGHJKLMNPQRSTUVWXYZ'.includes(e.key.toUpperCase())){if(menuLcode.length<8){menuLcode+=e.key.toUpperCase();buildMenu();}}
    else if(e.key==='Backspace'){menuLcode=menuLcode.slice(0,-1);buildMenu();}
    else if(e.key==='Escape'){menuSection=menuSection==='frLoad'?'freeRoam':'story';menuSel=0;buildMenu();}
    if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
    return;
  }
  // Settings volume: ←→ anywhere in settings section
  if(menuSection==='settings'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
    const d=e.key==='ArrowRight'?0.1:-0.1;V01DA.setVol(Math.round((V01DA.getVol()+d)*10)/10);buildMenu();e.preventDefault();return;
  }
  const items=itemsEl.querySelectorAll('.item');const n=items.length;
  if(e.key==='ArrowUp'||e.key==='w'){menuSel=(menuSel-1+n)%n;buildMenu();}
  else if(e.key==='ArrowDown'||e.key==='s'){menuSel=(menuSel+1)%n;buildMenu();}
  else if(e.key==='Enter'){items[menuSel]?.onclick?.();}
  else if(e.key==='Escape'){
    if(menuSection==='story'||menuSection==='freeRoam'||menuSection==='controls'){menuSection='root';menuSel=0;buildMenu();}
    else if(menuSection==='missionSelect'){menuSection='story';menuSel=0;buildMenu();}
    else if(menuSection==='frNewGame'){menuSection='freeRoam';menuSel=0;buildMenu();}
    else if(menuSection==='frLoad'){menuSection='freeRoam';menuSel=0;buildMenu();}
    else if(menuSection==='stLoad'){menuSection='story';menuSel=0;buildMenu();}
  }
  if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
});

// ── Start campaign ────────────────────────────────────────────────────────────
function _startCampaign(){
  _campaignRunning=true;
  _campaignStep=0;
  menuEl.style.display='none';
  _runCampaignStep();
}

function _campaignReturn(){
  V01DA.set('menu');
  // Called when a chapter or transmission ends
  _campaignStep++;
  if(_campaignStep>=CSEQ.length){
    _finishCampaign();
    return;
  }
  CSTATE.step=_campaignStep;
  cSave(CSTATE);
  _runCampaignStep();
}

function _finishCampaign(){
  V01DA.set('menu');
  CSTATE.completed=true;
  CSTATE.runs=(CSTATE.runs||0)+1;
  cSave(CSTATE);
  _campaignRunning=false;
  _hideCampaignOverlay();
  menuEl.style.display='flex';
  buildMenu();
}

function _abortCampaign(){
  V01DA.set('menu');
  clearTimeout(_chapterTimerT);
  if(_archiveKeyHandler){document.removeEventListener('keydown',_archiveKeyHandler);_archiveKeyHandler=null;}
  if(G){
    G.audio.stop();G.narrator.stop();
    document.removeEventListener('keydown',_onKeyDown);document.removeEventListener('keyup',_onKeyUp);
    G=null;if(_raf){cancelAnimationFrame(_raf);_raf=null;}
    cvs.style.display='none';tvEl.style.display='none';
  }
  _campaignRunning=false;
  _hideCampaignOverlay();
  menuEl.style.display='flex';
  buildMenu();
}

function _runCampaignStep(){
  const step=CSEQ[_campaignStep];
  if(!step){_finishCampaign();return;}
  if(step.type==='tx') _runTransmission(step);
  else if(step.type==='gfx') _runGfxChapter(step);
  else if(step.type==='archive') _runArchiveChapter(step);
  else if(step.type==='void_archive') _runVoidArchiveChapter(step);
  else if(step.type==='pysplore') _runPysploreChapter(step);
  else _campaignReturn();
}

// ── Typewriter transmission ───────────────────────────────────────────────────
function _runTransmission(step){
  V01DA.set('tx');
  _txReady=false;
  _showCampaignOverlay();
  _co.innerHTML='';

  const idx=_campaignStep+1,total=CSEQ.length;
  const prog=document.createElement('div');
  prog.style.cssText='position:absolute;top:16px;right:20px;color:#003311;font-size:.72em;letter-spacing:.2em;';
  prog.textContent=`${String(idx).padStart(2,'0')} / ${total}`;
  _co.appendChild(prog);

  const esc=document.createElement('div');
  esc.style.cssText='position:absolute;top:16px;left:20px;color:#003311;font-size:.72em;letter-spacing:.2em;';
  esc.textContent='[ ESC — skip ]';
  _co.appendChild(esc);

  const lbl=document.createElement('div');
  lbl.style.cssText='color:#008820;font-size:.72em;letter-spacing:.4em;margin-bottom:28px;margin-top:60px;padding:0 70px;';
  lbl.textContent=step.label;
  _co.appendChild(lbl);

  const txt=document.createElement('div');
  txt.style.cssText='font-size:1em;line-height:2;max-width:700px;letter-spacing:.04em;white-space:pre-wrap;padding:0 70px;min-height:200px;';
  _co.appendChild(txt);

  const adv=document.createElement('div');
  adv.style.cssText='color:#446644;font-size:.75em;letter-spacing:.2em;margin-top:36px;padding:0 70px;opacity:0;transition:opacity .4s;';
  adv.textContent='';
  _co.appendChild(adv);

  if(!document.getElementById('_blink_style')){
    const st=document.createElement('style');st.id='_blink_style';
    st.textContent='@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}';
    document.head.appendChild(st);
  }

  const cur=document.createElement('span');
  cur.style.cssText='display:inline-block;width:10px;height:1.1em;background:#00ff41;vertical-align:bottom;animation:blink .5s step-end infinite;';
  txt.appendChild(cur);

  let i=0,done=false;
  const t=step.text;
  function finish(){
    if(done)return;done=true;
    cur.remove();_txReady=true;adv.style.opacity='1';
  }
  function tick(){
    if(i<t.length){
      if(t[i]==='\n')cur.before(document.createElement('br'));
      else cur.before(document.createTextNode(t[i]));
      i++;setTimeout(tick,22+Math.random()*18);
    }else finish();
  }
  tick();

  function advance(){
    document.removeEventListener('keydown',txKey);
    _hideCampaignOverlay();
    if(_campaignStep>=CSEQ.length-1){_finishCampaign();}else{_campaignReturn();}
  }

  function txKey(e){
    if(e.key==='Escape'){
      // ESC always skips immediately
      advance();
    } else if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      if(_txReady){advance();}
      else{finish();} // first press: complete text instantly
    }
  }
  document.addEventListener('keydown',txKey);
}

function _launchGfxEngine(step){
  _hideCampaignOverlay();
  menuEl.style.display='none';

  function onChapterQuit(){
    if(_phosStop){_phosStop();_phosStop=null;} // stop phos engine audio immediately
    clearTimeout(_chapterTimerT);
    const te=document.getElementById('_chTimer');if(te)te.remove();
    if(G){G.audio.stop();G.narrator.stop();}
    G=null;if(_raf){cancelAnimationFrame(_raf);_raf=null;}
    cvs.style.display='none';tvEl.style.display='none';
    _hideLogOverlay();
    document.removeEventListener('keydown',_onKeyDown);
    document.removeEventListener('keyup',_onKeyUp);
    document.removeEventListener('keydown',_chEscKey,true);
    _campaignReturn();
  }

  // ESC always skips any GFX chapter immediately
  function _chEscKey(e){
    if(e.key==='Escape'){
      e.preventDefault();
      e.stopPropagation();
      onChapterQuit();
    }
  }
  document.addEventListener('keydown',_chEscKey,true); // capture phase so it fires before Game's handler

  // Phos City chapter — pure drive, uses vehRender directly, no Game instance needed
  if(step.mode==='phos'){
    V01DA.set('ch2');
    _launchPhosCity(onChapterQuit, step);
    return;
  }

  G=new Game(onChapterQuit,false);
  G.campaignMode=true;
  G.P.campaignMode=true;
  if(step.mode==='dungeon')V01DA.set('ch4');
  else V01DA.set('ch1');

  if(step.mode==='space'){
    G.P.spaceEnemies=[];
  }

  if(step.mode==='dungeon'){
    G.combat=true; // enable death/respawn for ch4
    const planet=G.planetField.planets.find(p=>p.biome===DUNGEON);
    if(planet){
      G.P.craft.pos=[planet.pos[0]+planet.size*4+50,planet.pos[1],planet.pos[2]];
      G.P.land(planet);
    }
    G.P.takeoff=()=>{G.showMsg('>>> ON FOOT — EMITTER ONLY');};
    G._spawnVehicleWave=()=>{G.showMsg('>>> ON FOOT — NO VEHICLES');};
    // Clear all vehicles, logs and block any vehicle interaction
    G.P.vehicles=[];
    G.P.logEntries=[];
    G.P.enterVehicle=()=>false;
    G.P.nearestVehicle=()=>null;
    // Keep vehicles and logs cleared as world chunks reload
    const _origLand=G.P.land.bind(G.P);
    G.P.land=(planet)=>{_origLand(planet);G.P.vehicles=[];G.P.logEntries=[];};

    // Ch4: Reduce entity damage to ~20% and slow attack rate so health doesn't drain fast
    for(const e of G.P.entities){
      e.dmg=Math.max(1,Math.floor(e.dmg*0.18));
      e.atCd=30; // slower attack cooldown reset
    }

    // Ch4: Patch Ent.update so damage is always reduced by 80% in this chapter
    const _origEntHit=Ent.prototype.hit;
    const _origEntUpdate=Ent.prototype.update;
    // Wrap entity attack damage — applied globally in this Game session only
    G._ch4DmgMult=0.18;

    // Ch4: Respawn at nearest checkpoint on death
    const _origRespawn=G._respawnFoot.bind(G);
    G._respawnFoot=function(){
      const P=this.P;
      const[px,py]=P.pos();
      // find nearest terminal as checkpoint
      let bestT=null,bestD=1e9;
      for(const t of P.terminals){const d=Math.hypot(px-t.x,py-t.y);if(d<bestD){bestD=d;bestT=t;}}
      const router=P.router||P.boardRouter;
      let ox=P._ckX,oy=P._ckY;
      if(bestT&&router){[ox,oy]=P._openSpawn(router,bestT.x,bestT.y);}
      else if(router){[ox,oy]=P._openSpawn(router,P._ckX,P._ckY);}
      P.cv.pos=[ox,oy];P.cv.health=P.cv.maxHealth;P.cv.shield=P.cv.maxShield;
      P.heat=0;P.overheated=false;
      this.showMsg('>>> DOWN — RESPAWNING AT NEAREST CHECKPOINT');this.audio.playSfx('death');
    };

    // Ch4: Enemies spawn far in front of player, player flipped 180 from land direction
    if(G.P.router){
      const [spx,spy]=G.P.cv.pos;
      G.P._ckX=spx;G.P._ckY=spy;

      // Flip player 180° from wherever _openFacingDir pointed them
      const curAngle=Math.atan2(G.P.cv.dir[1],G.P.cv.dir[0]);
      const flipped=curAngle+Math.PI;
      const fdx=Math.cos(flipped),fdy=Math.sin(flipped);
      G.P.cv.dir=[fdx,fdy];
      G.P.cv.plane=[fdy*.66,-fdx*.66];

      // Spawn enemies far in front of the player (in the direction they now face)
      const newEnts=[];
      const router=G.P.router;
      const count=10;
      for(let i=0;i<count;i++){
        const spread=(i/count)*TAU*0.5 - TAU*0.25; // 180° arc in front
        const ang=flipped+spread+(Math.random()-0.5)*0.4;
        const r=55+Math.random()*30;
        const ex=spx+Math.cos(ang)*r;
        const ey=spy+Math.sin(ang)*r;
        const[ox,oy]=G.P._openSpawn(router,ex,ey);
        const ch=ECHARS[Math.floor(Math.random()*ECHARS.length)];
        const ent=new Ent(ox,oy,ch);
        ent.speed=ESPD[ch]*0.28;
        ent.dmg=Math.max(1,Math.floor(ent.dmg*0.18));
        ent._ch4creep=true;
        newEnts.push(ent);
      }

      // Patch entity update for ch4: always creep toward player regardless of distance
      const _origUpdate=Ent.prototype.update;
      Ent.prototype.update=function(cam,router){
        if(this._ch4creep&&this.alive()&&!this.pac&&this.conf<=0){
          const dx=cam.pos[0]-this.x,dy=cam.pos[1]-this.y,dist=Math.hypot(dx,dy);
          if(dist>1.0){
            const ang=Math.atan2(dy,dx);
            const nx=this.x+Math.cos(ang)*this.speed;
            const ny=this.y+Math.sin(ang)*this.speed;
            if(router.isOpen(nx,this.y))this.x=nx;
            if(router.isOpen(this.x,ny))this.y=ny;
          }
          this.state='CHASE';
          if(!this.spoke&&dist<14&&this.mT<=0){
            const ls=DLG[this.char]||['...'];
            this.msg=ls[Math.floor(Math.random()*ls.length)];this.mT=90;this.spoke=true;
          }
          if(this.mT>0)this.mT--;
          if(this.mT<=0)this.msg='';
          if(this.flash>0)this.flash--;
          if(this.atCd>0&&this.atCd<9999)this.atCd--;
          if(dist<1.1&&this.atCd<=0&&this.atCd<9999){
            this.state='ATTACK';
            if(!this.pac&&this.conf<=0)cam.health-=Math.max(1,Math.floor(this.dmg/5));
            this.atCd=90;
          }
          return;
        }
        _origUpdate.call(this,cam,router);
      };

      G.P.entities=[...newEnts,...G.P.entities.slice(0,Math.max(0,G.P.entities.length-6))];
    }
  }

  // Universal 10-minute timer for all GFX chapters
  _startChapterTimer(step.label, onChapterQuit, step.mode==='space'?' · F = land on planet to advance':'');

  if(step.mode==='space'){
    G.showMsg('>>> DRIFT — fly to a planet · press F to land · ESC to skip');
  } else {
    G.showMsg(`>>> ${step.label} · ESC to skip chapter`);
  }

  G.audio.start();
  document.addEventListener('keydown',_onKeyDown);
  document.addEventListener('keyup',_onKeyUp);
  cvs.addEventListener('mousedown',()=>{if(G)G._lmb=true;});
  cvs.addEventListener('mouseup',()=>{if(G)G._lmb=false;});
  tvEl.addEventListener('mousedown',()=>{if(G)G._lmb=true;});
  tvEl.addEventListener('mouseup',()=>{if(G)G._lmb=false;});
  _lastT=performance.now();_raf=requestAnimationFrame(_loop);
}

function _startChapterTimer(label, onDone, extraHint=''){
  let secsLeft=600;
  const timerEl=document.createElement('div');
  timerEl.id='_chTimer';
  timerEl.style.cssText="position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#446644;font-family:'Courier New',monospace;font-size:10px;letter-spacing:.15em;pointer-events:none;z-index:300;background:rgba(0,0,0,.6);padding:2px 10px;";
  document.body.appendChild(timerEl);
  function tick(){
    const el=document.getElementById('_chTimer');
    if(!el||!_campaignRunning){if(el)el.remove();return;}
    const m=Math.floor(secsLeft/60),s=secsLeft%60;
    el.textContent=`${label}  ·  ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}  ·  ESC skip${extraHint}`;
    if(secsLeft<=0){el.remove();onDone();return;}
    secsLeft--;
    _chapterTimerT=setTimeout(tick,1000);
  }
  tick();
}

// ── Phos City chapter — pure ASCII drive, no Game instance ───────────────────
function _launchPhosCity(onDone, step){
  // Use the engine's existing tv div and vehRender with a DriveCam + PhosCR
  tvEl.style.display='block';
  tvEl.style.color='#00cc88';
  cvs.style.display='none';

  const router=new PhosCR(42^(Math.random()*0xFFFF|0));
  const cam=new DriveCam();
  // Find a street spawn
  for(let r=0;r<30;r++){for(let t=0;t<Math.max(8,r*4);t++){const a=t/Math.max(8,r*4)*TAU,x=6.5+r*0.6*Math.cos(a),y=6.5+r*0.6*Math.sin(a);if(router.isOpen(x,y)){cam.x=x;cam.y=y;break;}}}
  cam.angle=Math.PI/2;

  // Fake Player shell for vehRender
  const fakeP={
    veh:cam,vehRouter:router,router,biome:CITY,
    vehicles:[],entities:[],mode:'vehicle',
    powerups:{SPEED_BOOST:0,SLOW_TIME:0,RAPID_FIRE:0},
    worldBubble:{drawShards:()=>{},tick:()=>null,_sh:[]},
    overheated:false,heat:0,
    pos(){return[cam.x,cam.y,0];}
  };

  const keys=new Set();
  let phosRaf=null,phosLast=performance.now(),phosRunning=true;
  let engCd=0;

  // Minimal audio — use existing AEng from a throwaway Game context
  // Actually just use the engine's audio SFX from a minimal setup
  const phosAudio=new AEng();
  phosAudio.start();

  let phosPaused=false,phosOvEl=null;

  // ── Phos City pause menu (Enter key) — same options as in-game overlay ──
  function _phosOvClose(){
    phosPaused=false;phosRunning=true;keys.clear();
    if(phosOvEl){if(phosOvEl._k)document.removeEventListener('keydown',phosOvEl._k,true);phosOvEl.remove();phosOvEl=null;}
    phosRaf=requestAnimationFrame(phosLoop);
  }
  function _phosOvOpen(){
    phosPaused=true;phosRunning=false;keys.clear();
    if(phosRaf){cancelAnimationFrame(phosRaf);phosRaf=null;}
    let inOpts=false,mSel=0,oSel=0;
    phosOvEl=document.createElement('div');
    phosOvEl.style.cssText='position:fixed;inset:0;z-index:998;display:flex;align-items:center;justify-content:center;background:rgba(0,0,5,.65);font-family:"Courier New",monospace;';
    function rdr(){
      const mvol=V01DA.volPct();
      const vbar='█'.repeat(Math.round(mvol/10))+'░'.repeat(10-Math.round(mvol/10));
      const mItems=['RESUME','OPTIONS','SKIP CHAPTER'];
      const oItems=[`MUSIC        [${vbar}] ${mvol===0?'OFF':mvol+'%'}`,`SFX          ${phosAudio.sx?'ON ':'OFF'}`,'BACK'];
      let h='<div style="background:#000008;border:1px solid #00bb44;padding:24px 42px;min-width:300px;">';
      h+='<div style="color:#00ff88;letter-spacing:.3em;margin-bottom:18px;text-align:center;">'+(inOpts?'O P T I O N S':'P A U S E D')+'</div>';
      (inOpts?oItems:mItems).forEach((it,i)=>{
        const s=(inOpts?i===oSel:i===mSel);
        h+=`<div style="padding:5px 0;color:${s?'#ffffff':'#00ff88'};letter-spacing:.12em;">${s?'→  ':'   '}${it}</div>`;
      });
      if(inOpts)h+='<div style="margin-top:10px;color:#446644;font-size:.8em;letter-spacing:.06em;">◄ ► adjust music volume</div>';
      h+='<div style="margin-top:14px;color:#446644;font-size:.75em;letter-spacing:.08em;">↑↓ navigate · ENTER select · ESC back</div></div>';
      phosOvEl.innerHTML=h;
    }
    function kh(e){
      if(!phosPaused)return;
      if(!inOpts){
        if(e.key==='ArrowUp'||e.key==='w'){mSel=(mSel-1+3+3)%3;rdr();}
        else if(e.key==='ArrowDown'||e.key==='s'){mSel=(mSel+1)%3;rdr();}
        else if(e.key==='Enter'){
          if(mSel===0)_phosOvClose();
          else if(mSel===1){inOpts=true;oSel=0;rdr();}
          else if(mSel===2){if(_phosStop){_phosStop();_phosStop=null;}if(phosOvEl){if(phosOvEl._k)document.removeEventListener('keydown',phosOvEl._k,true);phosOvEl.remove();phosOvEl=null;}phosPaused=false;onDone();}
        }
        else if(e.key==='Escape')_phosOvClose();
      } else {
        if(e.key==='ArrowUp'||e.key==='w'){oSel=(oSel-1+3+3)%3;rdr();}
        else if(e.key==='ArrowDown'||e.key==='s'){oSel=(oSel+1)%3;rdr();}
        else if(e.key==='ArrowLeft'&&oSel===0){V01DA.setVol(Math.round((V01DA.getVol()-.1)*10)/10);rdr();}

class _VaSRNG{constructor(s){this.s=s>>>0;}next(){this.s=(Math.imul(1664525,this.s)+1013904223)>>>0;return this.s/4294967296;}choice(a){return a[Math.floor(this.next()*a.length)];}}

const _VA_MOODS=['The void whispers','Silence descends','A pulse emerges','Static drowns','The drift continues','Your engines hum','Sensors detect','Empty space contains','You remember nothing','The night deepens','Fragments scatter','The signal repeats'];
const _VA_ENCOUNTERS=['a derelict station drifting in darkness','an anomaly in spacetime','a transmission from no known source','ancient machine architecture floating silent','coordinates to nowhere in your database',"a structure that shouldn't exist",'reading from sensors you don\'t recognize','a reflection that isn\'t yours'];

// ProceduralWorld — 3D infinite chunks for stars, 2D for city
const _vaW=(()=>{
  const sc={},cc={};
  const SG=['·','*','+','°','✦','★','.','`','×','◦'],SC=['#ffffff','#aabbff','#ffddaa','#aaffff','#ffbbbb','#88aaff','#ffeecc','#ccffee'];
  const PLC=['@','O','#','0','Θ','⊕'],PCC=['#ff8844','#44aaff','#aaff88','#ffaa44','#ff44aa','#88ffff'];
  return{
    // 3D star chunks — infinite in all directions
    stars(cx,cy,cz,size){
      const k=`s${cx},${cy},${cz}`;if(sc[k])return sc[k];
      const r=new _VaSRNG((cx*73856093^cy*19349663^cz*83492791)>>>0),a=[];
      for(let i=0;i<180;i++){
        // Spherical distribution for more natural galaxy feel
        const phi=r.next()*Math.PI*2,cosT=r.next()*2-1,sinT=Math.sqrt(1-cosT*cosT);
        const radius=r.next()*size;
        a.push({
          p:[radius*sinT*Math.cos(phi),radius*cosT,radius*sinT*Math.sin(phi)],
          g:SG[Math.floor(r.next()*SG.length)],c:SC[Math.floor(r.next()*SC.length)],b:r.next()
        });
      }
      // Evict oldest chunks to avoid memory growth
      if(Object.keys(sc).length>100){const keys=Object.keys(sc);delete sc[keys[0]];}
      sc[k]=a;return a;
    },
    planets(cx,cy,cz,size){
      const k=`p${cx},${cy},${cz}`;if(sc[k])return sc[k];
      const r=new _VaSRNG((cx*50021121^cy*13331313^cz*91234567)>>>0),a=[];
      for(let i=0;i<2;i++){
        const phi=r.next()*Math.PI*2,cosT=r.next()*2-1,sinT=Math.sqrt(1-cosT*cosT),radius=r.next()*size*.8+size*.1;
        a.push({p:[radius*sinT*Math.cos(phi),radius*cosT,radius*sinT*Math.sin(phi)],c:PLC[Math.floor(r.next()*6)],col:PCC[Math.floor(r.next()*6)],r:30+Math.floor(r.next()*120)});
      }
      sc[k]=a;return a;
    },
    cityChunk(cx,cy){const k=`${cx},${cy}`;if(cc[k])return cc[k];const r=new _VaSRNG((cx*374761393^cy*668265263)>>>0),ch=[];for(let y=0;y<32;y++){ch.push([]);for(let x=0;x<32;x++)ch[y].push(x%4===0||y%4===0?0:r.next()>0.3?1:0);}cc[k]=ch;return ch;},
    encounter(seed){const r=new _VaSRNG(seed>>>0);return r.choice(_VA_MOODS)+': '+r.choice(_VA_ENCOUNTERS);}
  };
})();

// ── SpaceFlightEngine — infinite 3D galaxy, 3x3x3 chunk grid always centered on player ──
class _VaSpaceEng{
  constructor(){
    this.pos=[0,0,0];this.fwd=[0,0,1];this.up=[0,1,0];this.right=[1,0,0];
    this.vel=0;this.keys=new Set();
    this.CC=3000; // chunk size — smaller = denser stars
  }
  _rot(v,ax,a){const c=Math.cos(a),s=Math.sin(a),d=v[0]*ax[0]+v[1]*ax[1]+v[2]*ax[2],cr=[ax[1]*v[2]-ax[2]*v[1],ax[2]*v[0]-ax[0]*v[2],ax[0]*v[1]-ax[1]*v[0]];return[v[0]*c+cr[0]*s+ax[0]*d*(1-c),v[1]*c+cr[1]*s+ax[1]*d*(1-c),v[2]*c+cr[2]*s+ax[2]*d*(1-c)];}
  _prj(wp,w,h){
    const dx=wp[0]-this.pos[0],dy=wp[1]-this.pos[1],dz=wp[2]-this.pos[2];
    const lx=dx*this.right[0]+dy*this.right[1]+dz*this.right[2];
    const ly=dx*this.up[0]+dy*this.up[1]+dz*this.up[2];
    const lz=dx*this.fwd[0]+dy*this.fwd[1]+dz*this.fwd[2];
    if(lz<10)return null;const f=700/lz;
    return[w/2+lx*f,h/2-ly*f,f,lz];
  }
  update(){
    const ts=0.05,ms=18;
    if(this.keys.has('w')){this.fwd=this._rot(this.fwd,this.right,-ts);this.up=this._rot(this.up,this.right,-ts);}
    if(this.keys.has('s')){this.fwd=this._rot(this.fwd,this.right,ts);this.up=this._rot(this.up,this.right,ts);}
    if(this.keys.has('a')){this.fwd=this._rot(this.fwd,this.up,-ts);this.right=this._rot(this.right,this.up,-ts);}
    if(this.keys.has('d')){this.fwd=this._rot(this.fwd,this.up,ts);this.right=this._rot(this.right,this.up,ts);}
    if(this.keys.has('q')){this.up=this._rot(this.up,this.fwd,ts);this.right=this._rot(this.right,this.fwd,ts);}
    if(this.keys.has('e')){this.up=this._rot(this.up,this.fwd,-ts);this.right=this._rot(this.right,this.fwd,-ts);}
    if(this.keys.has('ArrowUp'))this.pos=this.pos.map((p,i)=>p+this.up[i]*ms);
    if(this.keys.has('ArrowDown'))this.pos=this.pos.map((p,i)=>p-this.up[i]*ms);
    if(this.keys.has('ArrowLeft'))this.pos=this.pos.map((p,i)=>p-this.right[i]*ms);
    if(this.keys.has('ArrowRight'))this.pos=this.pos.map((p,i)=>p+this.right[i]*ms);
    const tgt=this.keys.has(' ')?80:0;
    this.vel+=(tgt-this.vel)*0.07;
    this.pos=this.pos.map((p,i)=>p+this.fwd[i]*this.vel);
  }
  render(ctx,w,h){
    ctx.fillStyle='#0a0700';ctx.fillRect(0,0,w,h);
    // 3D chunk coordinates — follows player position in all 3 axes
    const CC=this.CC;
    const cx=Math.floor(this.pos[0]/CC),cy=Math.floor(this.pos[1]/CC),cz=Math.floor(this.pos[2]/CC);
    ctx.textBaseline='middle';
    // 3x3x3 = 27 surrounding chunks — infinite in all directions
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
      const ox=(cx+dx)*CC,oy=(cy+dy)*CC,oz=(cz+dz)*CC;
      // Stars — 180 per chunk, spherical distribution
      for(const s of _vaW.stars(cx+dx,cy+dy,cz+dz,CC)){
        const p=this._prj([s.p[0]+ox,s.p[1]+oy,s.p[2]+oz],w,h);
        if(p&&p[0]>=0&&p[0]<w&&p[1]>=0&&p[1]<h){
          // Size varies with distance for depth perception
          const fs=Math.max(7,Math.min(14,Math.floor(p[2]*8)));
          ctx.fillStyle=s.c;ctx.font=`${fs}px "Courier New"`;
          ctx.fillText(s.b>0.4?s.g:'.',p[0],p[1]);
        }
      }
      // Planets — 2 per chunk
      for(const pl of _vaW.planets(cx+dx,cy+dy,cz+dz,CC*1.5)){
        const p=this._prj([pl.p[0]+ox,pl.p[1]+oy,pl.p[2]+oz],w,h);
        if(p&&p[0]>=0&&p[0]<w&&p[1]>=0&&p[1]<h){
          const sz=Math.max(8,Math.floor(pl.r*p[2]*0.008));
          ctx.fillStyle=pl.col;ctx.font=`${sz}px "Courier New"`;
          ctx.fillText(pl.c.repeat(Math.max(1,(sz/3)|0)),p[0],p[1]);
        }
      }
    }
    // HUD — Python SpaceFlightEngine.render() exact
    const ps=`[${String(Math.floor(this.pos[0])).padStart(6,'0')},${String(Math.floor(this.pos[1])).padStart(6,'0')},${String(Math.floor(this.pos[2])).padStart(6,'0')}]`;
    ctx.textAlign='center';ctx.font='10px "Courier New"';
    ctx.fillStyle='#ffcc00';ctx.fillText(`6DOF ACTIVE | VEL: ${Math.floor(this.vel)} | POS: ${ps}`,w/2,h-60);
    ctx.fillStyle='#44ffff';ctx.font='14px "Courier New"';ctx.fillText('--[+]--',w/2,h/2);
    ctx.fillStyle='#ffb000';ctx.font='8px "Courier New"';ctx.textAlign='left';
    ctx.fillText('W/S:Pitch  A/D:Yaw  Q/E:Roll  SPACE:Thrust  ↑↓←→:Strafe',20,h-20);
    ctx.fillStyle='#334433';ctx.textAlign='right';ctx.fillText('ESC — archive menu',w-20,20);
  }
}

// ── CityDriveEngine — Python exact simple angle/dist projection ───────────────
class _VaCityEng{

  update(){const spd=2;if(this.keys.has('a')||this.keys.has('ArrowLeft'))this.angle-=0.06;if(this.keys.has('d')||this.keys.has('ArrowRight'))this.angle+=0.06;if(this.keys.has('w')||this.keys.has('ArrowUp')){this.x+=Math.cos(this.angle)*spd;this.y+=Math.sin(this.angle)*spd;}if(this.keys.has('s')||this.keys.has('ArrowDown')){this.x-=Math.cos(this.angle)*spd;this.y-=Math.sin(this.angle)*spd;}}

// ── Game loop (same as original) ──────────────────────────────────────────────
function _loop(ts){
  if(!G){_raf=null;return;}
  const dt=Math.min(.1,(ts-_lastT)/1000);_lastT=ts;
  G.update(dt);
  const P=G.P;

  if(G.ov){
    tvEl.style.display='block';cvs.style.display='none';
    tvEl.style.color=BRIGHT[G.opts.bright];
    tvEl.textContent=G.renderOv();
    _raf=requestAnimationFrame(_loop);return;
  }

  if(P.logOpen&&P.mode!=='space'){
    tvEl.style.display='none';cvs.style.display='none';
    _showLogOverlay(P);
    _raf=requestAnimationFrame(_loop);return;
  }
  _hideLogOverlay();

  if(P.mode==='space'){
    tvEl.style.display='none';cvs.style.display='block';
    cvs.width=cvs.clientWidth;cvs.height=cvs.clientHeight;
    const ctx=cvs.getContext('2d');ctx.fillStyle='#000005';ctx.fillRect(0,0,cvs.width,cvs.height);
    window.spaceRender(cvs,P,G.starfield,G.planetField,G.comets,G.audio,G.frame);
  }else{
    cvs.style.display='none';tvEl.style.display='block';
    tvEl.style.color=BRIGHT[G.opts.bright];
    let text='';
    if(P.mode==='vehicle')text=vehRender(P,GRID_W,GRID_H);
    else text=cvRender(P,GRID_W,GRID_H);
    if(G.msgT>0){const lines=text.split('\n');const mi=Math.floor(lines.length/4);const row=[...lines[mi]];const ms=G.msg,sx=Math.max(0,Math.floor(GRID_W/2-ms.length/2));for(let i=0;i<ms.length;i++)if(sx+i<GRID_W)row[sx+i]=ms[i];lines[mi]=row.join('');text=lines.join('\n');}
    tvEl.textContent=text;
  }
  if(P.mode==='space'&&G.msgT>0)showMsg(G.msg,G.msgT);
  _updateLogMarkers();
  _raf=requestAnimationFrame(_loop);
}

    }

function _onKeyDown(e){
  if(!G)return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();

}

// ── Log overlay (same as original) ───────────────────────────────────────────
const _logOverlayEl=document.getElementById('log-overlay');
const _logInnerEl=document.getElementById('log-inner');
const _logEntriesEl=document.getElementById('log-entries-container');
let _logOverlayShown=false,_logLastCount=-1;
function _showLogOverlay(P){
  const entries=P.logEntries||[];
  if(!_logOverlayShown||_logLastCount!==entries.length){
    _logLastCount=entries.length;
    _logEntriesEl.innerHTML=!entries.length?'<div class="log-empty">— no entries yet —</div>':entries.map((e,i)=>`<div class="log-entry"><div class="log-entry-num">ENTRY ${String(i+1).padStart(3,'0')}</div>${_escHtml(e)}</div>`).join('');
    const hdr=_logOverlayEl.querySelector('.log-header span:first-child');
    if(hdr)hdr.textContent=`⚙  A R T I F A C T   L O G   (${entries.length})`;
  }
  if(!_logOverlayShown){_logOverlayEl.style.display='block';_logOverlayShown=true;}
}
function _hideLogOverlay(){
  if(_logOverlayShown){_logOverlayEl.style.display='none';_logOverlayShown=false;_logLastCount=-1;}
}
function _escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
_logOverlayEl.addEventListener('wheel',e=>{e.preventDefault();_logInnerEl.scrollBy({top:e.deltaY,behavior:'auto'});},{passive:false});

const _logMarkersEl=document.getElementById('log-markers');
function _updateLogMarkers(){
  if(!G||!G.P){_logMarkersEl.innerHTML='';return;}
  const P=G.P;
  if(P.mode!=='foot'&&P.mode!=='board'){_logMarkersEl.innerHTML='';return;}
  if(P.logOpen){_logMarkersEl.innerHTML='';return;}
  const cam=P.cv;
  const inv=cam.plane[0]*cam.dir[1]-cam.dir[0]*cam.plane[1];
  if(Math.abs(inv)<1e-9){_logMarkersEl.innerHTML='';return;}
  const iD=1/inv;
  const W=window.innerWidth,H=window.innerHeight;
  const pins=[];
  const shards=(P.worldBubble&&P.worldBubble._sh)||[];
  for(const[lx,ly,,f]of shards){if(f)continue;const dx=lx-cam.pos[0],dy=ly-cam.pos[1];const tX=iD*(cam.dir[1]*dx-cam.dir[0]*dy),tY=iD*(-cam.plane[1]*dx+cam.plane[0]*dy);if(tY<0.4||tY>60)continue;const scrX=W/2*(1+tX/tY);if(scrX<-W*.4||scrX>W*1.4)continue;pins.push({x:scrX,y:H*.42,scale:Math.max(.4,Math.min(1.4,4/tY)),dist:tY});}
  if(P.artifactItems){for(const[ax,ay,,f]of P.artifactItems){if(f)continue;const dx=ax-cam.pos[0],dy=ay-cam.pos[1];const tX=iD*(cam.dir[1]*dx-cam.dir[0]*dy),tY=iD*(-cam.plane[1]*dx+cam.plane[0]*dy);if(tY<0.4||tY>60)continue;const scrX=W/2*(1+tX/tY);if(scrX<-W*.4||scrX>W*1.4)continue;pins.push({x:scrX,y:H*.42,scale:Math.max(.4,Math.min(1.4,4/tY)),dist:tY});}}
  if(!pins.length){_logMarkersEl.innerHTML='';return;}
  _logMarkersEl.innerHTML=pins.map(p=>{const sz=Math.round(p.scale*22),op=Math.max(.35,Math.min(1,1.2-p.dist/55));return `<div class="log-pin" style="left:${p.x.toFixed(1)}px;top:${p.y.toFixed(1)}px;opacity:${op.toFixed(2)}"><span class="gear" style="font-size:${sz}px">⚙</span><span class="lbl">LOG</span></div>`;}).join('');
}

let _pysClosing=false;
function _closePysplore(){
  if(_pysClosing)return; // prevent double-fire from ESC capture + propagation
  _pysClosing=true;
  _stopDAW();_stopClock();
  _pys.style.display='none';
  const _cb=_pysOnQuit;_pysOnQuit=null;
  // Double setTimeout: first tick clears this event's propagation, second runs the callback
  setTimeout(()=>setTimeout(()=>{
    _pysClosing=false;
    if(_cb){try{_cb();}catch(e){console.error('Pysplore quit cb error',e);}}
  },0),0);
}

// ESC closes Pysplore — capture phase, stopPropagation prevents it reaching txKey listener
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&_pys.style.display!=='none'){
    e.preventDefault();
    e.stopImmediatePropagation(); // stop ALL other handlers in capture AND bubble
    _closePysplore();
  }
},true);

// ── DAW ────────────────────────────────────────────────────────────────────────
const DAW_TRACKS=[
  {name:'Kick',   color:'#00e5a0', steps:Array(16).fill(false)},
  {name:'Snare',  color:'#4f9eff', steps:Array(16).fill(false)},
  {name:'HiHat',  color:'#9b6dff', steps:Array(16).fill(false)},
  {name:'Bass',   color:'#ff9a44', steps:Array(16).fill(false)},
  {name:'Lead',   color:'#ff3355', steps:Array(16).fill(false)},
  {name:'Pad',    color:'#00d96e', steps:Array(16).fill(false)},
];
let _dawPlaying=false, _dawStep=0, _dawTimer=null, _dawAC=null;

function _dawAudio(){
  if(!_dawAC)try{_dawAC=new(window.AudioContext||window.webkitAudioContext)();}catch{}
  return _dawAC;
}

function _dawPlaySound(trackIdx){
  const ac=_dawAudio(); if(!ac)return;
  if(ac.state==='suspended')ac.resume();
  const g=ac.createGain(); g.connect(ac.destination);
  const now=ac.currentTime;
  const configs=[
    // Kick
    ()=>{const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(0.001,now+0.4);g.gain.setValueAtTime(0.8,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.4);o.connect(g);o.start(now);o.stop(now+0.4);},
    // Snare
    ()=>{const b=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;g.gain.setValueAtTime(0.4,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.2);s.connect(f);f.connect(g);s.start(now);},
    // HiHat
    ()=>{const b=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=8000;g.gain.setValueAtTime(0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.05);s.connect(f);f.connect(g);s.start(now);},
    // Bass
    ()=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=80;g.gain.setValueAtTime(0.4,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);o.connect(g);o.start(now);o.stop(now+0.3);},
    // Lead
    ()=>{const freqs=[261,294,330,349,392];const f=freqs[Math.floor(Math.random()*freqs.length)];const o=ac.createOscillator();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.25);o.connect(g);o.start(now);o.stop(now+0.25);},
    // Pad
    ()=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=220;g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(0.25,now+0.1);g.gain.exponentialRampToValueAtTime(0.001,now+0.6);o.connect(g);o.start(now);o.stop(now+0.6);},
  ];
  if(configs[trackIdx]) configs[trackIdx]();
}

function _dawBuildGrid(){
  const area=document.getElementById('pys-track-area');
  if(!area)return;
  area.innerHTML='';
  DAW_TRACKS.forEach((track,ti)=>{
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;margin-bottom:4px;';
    const lbl=document.createElement('div');
    lbl.textContent=track.name;
    lbl.style.cssText=`width:52px;font-size:9px;color:${track.color};flex-shrink:0;`;
    row.appendChild(lbl);
    track.steps.forEach((on,si)=>{
      const btn=document.createElement('button');
      btn.className='pys-step '+(on?'on':'off');
      btn.id=`pys-step-${ti}-${si}`;
      btn.style.background=on?track.color:'#131528';
      if(si%4===0)btn.style.marginLeft='6px';
      btn.addEventListener('click',()=>{
        track.steps[si]=!track.steps[si];
        btn.style.background=track.steps[si]?track.color:'#131528';
        btn.className='pys-step '+(track.steps[si]?'on':'off');
      });
      row.appendChild(btn);
    });
    area.appendChild(row);
  });
}

function _dawTick(){
  if(!_dawPlaying)return;
  const bpm=parseInt(document.getElementById('pys-bpm')?.value||'120');
  const stepMs=60000/(bpm*4);
  // Highlight current step
  DAW_TRACKS.forEach((track,ti)=>{
    track.steps.forEach((_,si)=>{
      const btn=document.getElementById(`pys-step-${ti}-${si}`);
      if(!btn)return;
      if(si===_dawStep){
        btn.style.outline='2px solid #fff';
        if(track.steps[si])_dawPlaySound(ti);
      } else {
        btn.style.outline='none';
      }
    });
  });
  _dawStep=(_dawStep+1)%16;
  _dawTimer=setTimeout(_dawTick,stepMs);
}

function _stopDAW(){_dawPlaying=false;if(_dawTimer)clearTimeout(_dawTimer);_dawTimer=null;_dawStep=0;document.querySelectorAll('.pys-step').forEach(b=>b.style.outline='none');}

document.getElementById('pys-play-btn').addEventListener('click',()=>{
  if(_dawPlaying)return;

  _dawTick();
  document.getElementById('pys-play-btn').style.color='#00d96e';
});

function _initPaint(){

    ctx.fillStyle=grad;ctx.fillRect(0,0,c.width,c.height);
  }
  const tools=['pen','line','rect','circle','fill','erase'];
  tools.forEach(t=>{
    const btn=document.getElementById('pys-tool-'+t);
    if(btn)btn.addEventListener('click',()=>{
      _paintTool=t;

    });
  });

    ctx2.fillStyle=grad2;ctx2.fillRect(0,0,c.width,c.height);
  };
  c.onmousedown=e=>{_paintDrawing=true;_paintLast={x:e.offsetX,y:e.offsetY};if(_paintTool==='fill'){const ctx2=c.getContext('2d');ctx2.fillStyle=document.getElementById('pys-paint-color').value;ctx2.fillRect(0,0,c.width,c.height);}};
  c.onmousemove=e=>{if(!_paintDrawing||!_paintLast)return;const ctx2=c.getContext('2d');const col=document.getElementById('pys-paint-color').value;const sz=parseInt(document.getElementById('pys-paint-size').value)||4;if(_paintTool==='pen'){ctx2.strokeStyle=col;ctx2.lineWidth=sz;ctx2.lineCap='round';ctx2.beginPath();ctx2.moveTo(_paintLast.x,_paintLast.y);ctx2.lineTo(e.offsetX,e.offsetY);ctx2.stroke();_paintLast={x:e.offsetX,y:e.offsetY};}else if(_paintTool==='erase'){ctx2.strokeStyle='#E1F5FE';ctx2.lineWidth=sz*3;ctx2.lineCap='round';ctx2.beginPath();ctx2.moveTo(_paintLast.x,_paintLast.y);ctx2.lineTo(e.offsetX,e.offsetY);ctx2.stroke();_paintLast={x:e.offsetX,y:e.offsetY};}};
  c.onmouseup=e=>{if(!_paintDrawing||!_paintLast)return;const ctx2=c.getContext('2d');const col=document.getElementById('pys-paint-color').value;const sz=parseInt(document.getElementById('pys-paint-size').value)||4;if(_paintTool==='line'){ctx2.strokeStyle=col;ctx2.lineWidth=sz;ctx2.beginPath();ctx2.moveTo(_paintLast.x,_paintLast.y);ctx2.lineTo(e.offsetX,e.offsetY);ctx2.stroke();}else if(_paintTool==='rect'){ctx2.strokeStyle=col;ctx2.lineWidth=sz;ctx2.strokeRect(_paintLast.x,_paintLast.y,e.offsetX-_paintLast.x,e.offsetY-_paintLast.y);}else if(_paintTool==='circle'){ctx2.strokeStyle=col;ctx2.lineWidth=sz;ctx2.beginPath();const rx=(e.offsetX-_paintLast.x)/2,ry=(e.offsetY-_paintLast.y)/2;ctx2.ellipse(_paintLast.x+rx,_paintLast.y+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);ctx2.stroke();}; _paintDrawing=false;};
}

let _clockRunning=false, _swRunning=false, _swStart=0, _swElapsed=0;

function _startClock(){
  if(_clockRunning)return; _clockRunning=true; _clockTick();
}
